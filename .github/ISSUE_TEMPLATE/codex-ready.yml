name: Codex Ready Issue
description: Ready work item for workspace-autopilot-github
title: "[ready] "
labels: ["ready"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must be achieved.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files, behavior, and boundaries.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Observable done criteria.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands or checks to run.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What this issue must not do.
    validations:
      required: true
